<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>主页 · 蓝云网盘</title>
<meta name="description" content="蓝云网盘 BCD —— 基于 Cloudflare Worker + D1 的轻量网盘分享系统">
<link rel="icon" href="/img/logo.svg">
<link rel="stylesheet" href="/css/style.css">
<script>
  (function () {
    try {
      var t = localStorage.getItem('bcd-theme') || 'system';
      var d = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = d ? 'dark' : 'light';
    } catch (e) {}
  })();
</script>
</head>
<body>
<header class="topbar" id="topbar"></header>

<main class="hero">
  <div class="hero-banner"><img src="/img/background.png" alt="蓝云网盘"></div>

  <div class="hero-card">
    <img class="logo" src="/img/logo.svg" alt="蓝云网盘">
    <h1 id="siteName">蓝云网盘</h1>
    <p class="desc" id="siteDesc"></p>
    <div class="hero-actions">
      <a class="btn primary" href="/files" data-require-browse>进入所有文件</a>
      <a class="btn" href="/admin" id="adminEntry">登录</a>
    </div>
    <div class="hero-foot">
      <a class="footer-link" id="heroFoot" href="https://github.com/YXC-Lhy/BlueCloudDrive" target="_blank" rel="noopener noreferrer"></a>
    </div>
  </div>

  <section class="card notice-card hidden" id="noticeCard">
    <h3>📢 公告</h3>
    <div class="md-body" id="noticeBody"></div>
  </section>
</main>

<script src="/js/common.js"></script>
<script src="/js/md.js"></script>
<script>
  (async function () {
    const site = await BCD.boot({ active: 'home', title: '主页' });
    document.querySelector('#siteName').textContent = site.siteName || '蓝云网盘';
    document.querySelector('#siteDesc').textContent = site.homeDesc || '';
    document.querySelector('#adminEntry').textContent = site.isAdmin ? '进入管理后台' : '登录';
    document.querySelector('#heroFoot').textContent =
      'BlueCloudDrive v' + (site.version || '') + ' · All Rights Reserved.';

    const notice = String(site.homeNotice || '').trim();
    const card = document.querySelector('#noticeCard');
    if (notice) {
      document.querySelector('#noticeBody').innerHTML = BCD.markdown(notice);
      card.classList.remove('hidden');
    } else {
      card.classList.add('hidden');
    }
  })();
</script>
</body>
</html>
